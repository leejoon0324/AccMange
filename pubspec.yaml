name: twinlock
description: 离线双重验证认证器与加密密码保险箱。
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  mobile_scanner: ^7.1.4
  path_provider: ^2.1.5
  file_picker: ^10.3.7
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
